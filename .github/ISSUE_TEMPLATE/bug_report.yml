name: Bug report
description: Something doesn't work, or stopped working after a site update
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Please don't paste conversation content, titles, API keys or account details.**
        The diagnostics report is designed to contain none of these.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: dropdown
    id: site
    attributes:
      label: Where?
      multiple: true
      options:
        - ChatGPT (chatgpt.com)
        - Claude (claude.ai)
        - Side panel only
        - Local LLM features
        - Obsidian export
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics report
      description: Settings → Diagnostics → Run diagnostics → Copy report, while the affected site's tab is active. Paste it here.
      render: text
    validations:
      required: true
  - type: input
    id: chrome
    attributes:
      label: Chrome version
      placeholder: e.g. 141
  - type: input
    id: llm
    attributes:
      label: Local LLM server and model (if relevant)
      placeholder: e.g. oMLX + Qwen3.6-35B-A3B-4bit
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed conversation content, titles, API keys and account details from this report.
          required: true
